<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro:bit Step Counter (V2)</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #f0f2f5; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        #step-count { font-size: 80px; font-weight: bold; color: #007bff; margin: 20px 0; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; transition: 0.3s; margin: 5px; }
        .btn-connect { background-color: #28a745; color: white; }
        .btn-connect:hover { background-color: #218838; }
        .btn-disconnect { background-color: #dc3545; color: white; }
        #status { margin-top: 15px; color: #666; font-style: italic; }
        .error-msg { color: #dc3545; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>เครื่องนับก้าวติดรองเท้า</h1>
        <div id="step-count">0</div>
        <p>จำนวนก้าวทั้งหมด</p>
        
        <button class="btn-connect" onclick="connectBluetooth()">เชื่อมต่อ Micro:bit</button>
        <button class="btn-disconnect" onclick="disconnectBluetooth()">ตัดการเชื่อมต่อ</button>
        
        <div id="status">สถานะ: รอการเชื่อมต่อ...</div>
        <div id="error" class="error-msg"></div>
    </div>

    <script>
        // UUID ของ Nordic UART Service (ต้องตรงกับใน Micro:bit)
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice;
        let uartCharacteristic;

        async function connectBluetooth() {
            const statusLabel = document.getElementById('status');
            const errorLabel = document.getElementById('error');
            errorLabel.innerText = "";

            try {
                statusLabel.innerText = "กำลังค้นหาอุปกรณ์...";
                
                // ค้นหา Micro:bit
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                statusLabel.innerText = "กำลังเชื่อมต่อกับ Server...";
                const server = await bluetoothDevice.gatt.connect();

                statusLabel.innerText = "กำลังค้นหา Service (UART)...";
                // ขั้นตอนนี้คือจุดที่เคย Error: เราจะดึง Service ตาม UUID
                const service = await server.getPrimaryService(UART_SERVICE_UUID);

                statusLabel.innerText = "กำลังเชื่อมต่อช่องส่งข้อมูล...";
                uartCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                // เริ่มอ่านข้อมูล
                await uartCharacteristic.startNotifications();
                uartCharacteristic.addEventListener('characteristicvaluechanged', handleData);

                statusLabel.innerText = "เชื่อมต่อสำเร็จ! (V2 Ready)";
                statusLabel.style.color = "#28a745";

            } catch (err) {
                console.error(err);
                statusLabel.innerText = "การเชื่อมต่อล้มเหลว";
                errorLabel.innerText = "เกิดข้อผิดพลาด: " + err.message;
            }
        }

        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            const steps = value.trim();
            if (!isNaN(steps) && steps !== "") {
                document.getElementById('step-count').innerText = steps;
            }
        }

        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                document.getElementById('status').innerText = "ตัดการเชื่อมต่อแล้ว";
                document.getElementById('status').style.color = "#666";
            }
        }
    </script>
</body>
</html>
