<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Step Tracker | Micro:bit V2</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        
        .main-stat { margin: 20px 0; }
        #step-count { font-size: 70px; font-weight: 800; color: var(--primary); line-height: 1; }
        .label { color: #888; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }

        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .stat-box { background: #f8f9fa; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .stat-value { font-size: 22px; font-weight: bold; color: #333; }

        .goal-section { margin-top: 25px; padding: 15px; background: #eef6ff; border-radius: 15px; }
        .progress-container { background: #d0e3ff; height: 12px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        #progress-bar { background: var(--primary); width: 0%; height: 100%; transition: 0.5s; }

        .controls { margin-top: 25px; }
        button { padding: 12px 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 10px; }
        .btn-connect { background: var(--success); color: white; }
        .btn-disconnect { background: #eee; color: #666; font-size: 12px; }
        
        input[type="number"] { width: 80px; padding: 5px; border-radius: 5px; border: 1px solid #ccc; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="label">สถานะ: <span id="status" style="color:var(--danger)">ยังไม่เชื่อมต่อ</span></div>
    
    <div class="main-stat">
        <div id="step-count">0</div>
        <div class="label">ก้าวทั้งหมด</div>
    </div>

    <div class="goal-section">
        <span class="label">เป้าหมาย: </span>
        <input type="number" id="goal-input" value="1000" onchange="updateGoal()"> <span class="label">ก้าว</span>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="goal-text" class="label">สำเร็จแล้ว 0%</div>
    </div>

    <div class="grid-stats">
        <div class="stat-box">
            <div class="label">ระยะทาง (ม.)</div>
            <div id="distance" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="label">แคลอรี่ (kcal)</div>
            <div id="calories" class="stat-value">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-connect" id="connectBtn" onclick="connectBluetooth()">เชื่อมต่อรองเท้า</button>
        <button class="btn-disconnect" onclick="disconnectBluetooth()">ตัดการเชื่อมต่อ</button>
    </div>
</div>

<script>
    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice;
    let stepGoal = 1000;

    async function connectBluetooth() {
        try {
            document.getElementById('status').innerText = "กำลังค้นหา...";
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'BBC micro:bit' }],
                optionalServices: [UART_SERVICE_UUID]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                const value = new TextDecoder().decode(event.target.value);
                const steps = parseInt(value.trim());
                if (!isNaN(steps)) updateDisplay(steps);
            });

            document.getElementById('status').innerText = "เชื่อมต่อแล้ว";
            document.getElementById('status').style.color = "var(--success)";
            document.getElementById('connectBtn').style.display = "none";

        } catch (err) {
            document.getElementById('status').innerText = "ผิดพลาด!";
            alert("Error: " + err.message);
        }
    }

    function updateDisplay(steps) {
        // 1. อัปเดตตัวเลขก้าว
        document.getElementById('step-count').innerText = steps;

        // 2. คำนวณระยะทาง (เฉลี่ยก้าวละ 0.7 เมตร)
        const distance = (steps * 0.7).toFixed(1);
        document.getElementById('distance').innerText = distance;

        // 3. คำนวณแคลอรี่ (เฉลี่ยก้าวละ 0.04 kcal)
        const calories = (steps * 0.04).toFixed(2);
        document.getElementById('calories').innerText = calories;

        // 4. อัปเดต Progress Bar
        const percent = Math.min((steps / stepGoal) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('goal-text').innerText = `สำเร็จแล้ว ${Math.floor(percent)}%`;

        if (percent >= 100) {
            document.getElementById('goal-text').innerText = "🎉 บรรลุเป้าหมายแล้ว!";
            document.getElementById('goal-text').style.color = "var(--success)";
        }
    }

    function updateGoal() {
        stepGoal = document.getElementById('goal-input').value;
        const currentSteps = parseInt(document.getElementById('step-count').innerText);
        updateDisplay(currentSteps);
    }

    function disconnectBluetooth() {
        if (bluetoothDevice) {
            bluetoothDevice.gatt.disconnect();
            location.reload(); // รีโหลดหน้าเพื่อรีเซ็ตค่า
        }
    }
</script>
</body>
</html>
